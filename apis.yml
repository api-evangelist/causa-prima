aid: causa-prima
name: Causa Prima
description: >-
  Causa Prima is an AI-native fintech building an agent-to-agent network for finance
  teams — automating invoicing, dispute resolution, and dynamic (early-payment)
  discounting between buyers and suppliers. Its first public product, Scribo, is a
  free, EN 16931-compliant e-invoicing engine that generates German ZUGFeRD and
  XRechnung, plus plain US PDF invoices, through five surfaces: a web UI, an HTTP API,
  a hosted MCP server, an npm CLI, and a Claude / ChatGPT / Codex Agent Skill — all
  backed by the same public /api/v1 API with no signup (the sender's email is the login
  via a magic link). The team previously built Taulia (acquired by SAP) and Finoa;
  Causa Prima is backed by Creandum.
